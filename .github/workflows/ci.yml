name: CI

on:
  push:
    branches: [main, feat/phase1-foundations]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build model-core (types partagés)
        run: pnpm --filter @morax/model-core build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build worker
        run: pnpm --filter @morax/worker build

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Demarrer la stack locale et appliquer les migrations
        # Verifie que les migrations + RLS + pgmq s'appliquent sur une base ephemere.
        run: supabase start
      - name: Verifier les advisors (RLS, securite)
        run: supabase db lint || true
